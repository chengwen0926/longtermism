<body>
<div id="app"></div>
<dialog id="modal" aria-labelledby="modal-title"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const icons={calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 11h18M8 15h2M14 15h2"/>',leaf:'<path d="M19 3C9 2 3 7 5 14c3 8 15 5 14-11Z"/><path d="M4 21 15 8M8 16l-1-5M11 13h5"/>',notes:'<rect x="5" y="3" width="15" height="18" rx="2"/><path d="M9 8h7M9 12h7M9 16h4M3 7h3M3 12h3M3 17h3"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="m9 5 7 7-7 7"/>',left:'<path d="m15 5-7 7 7 7"/>',check:'<path d="m5 12 4 4L19 6"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',grip:'<circle cx="9" cy="6" r=".7"/><circle cx="15" cy="6" r=".7"/><circle cx="9" cy="12" r=".7"/><circle cx="15" cy="12" r=".7"/><circle cx="9" cy="18" r=".7"/><circle cx="15" cy="18" r=".7"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/>',book:'<path d="M12 6c-3-3-7-3-10-2v15c4-1 7 0 10 2 3-2 6-3 10-2V4c-3-1-7-1-10 2Zm0 0v15"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>',edit:'<path d="m15 4 5 5M4 20l5-1L21 7a2 2 0 0 0-4-4L5 15l-1 5Z"/>',trash:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5M19 11a7 7 0 0 0-12-6L4 8M5 13a7 7 0 0 0 12 6l3-3"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/>',flag:'<path d="M5 21V4c4-4 10 4 14 0v10c-4 4-10-4-14 0"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',link:'<path d="m10 14 4-4M8 16l-1 1a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0M16 8l1-1a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0" transform="translate(1 0) scale(.92)"/>',run:'<circle cx="15" cy="4" r="2"/><path d="m12 8 4 4 4 1M5 10l5-3 4 3-4 5 5 3-1 4M10 15l-4 5H2"/>'};
function icon(name,size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.leaf}</svg>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateObj(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
function dateStr(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
const TODAY=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function addDays(s,n){const d=dateObj(s);d.setDate(d.getDate()+n);return dateStr(d)}
function monday(s){const d=dateObj(s);return addDays(s,-((d.getDay()+6)%7))}
function diffDays(a,b){return Math.round((Date.UTC(...a.split('-').map((n,i)=>i===1?+n-1:+n))-Date.UTC(...b.split('-').map((n,i)=>i===1?+n-1:+n)))/86400000)}
function endDate(start,duration){if(duration!=='month')return addDays(start,Number(duration)-1);const d=dateObj(start),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);const max=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,max));return addDays(dateStr(d),-1)}
function md(s){const d=dateObj(s);return `${d.getMonth()+1}月${d.getDate()}日`}
function localStamp(s){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(s))}
function shortDate(s){return s?`${dateObj(s).getMonth()+1}.${String(dateObj(s).getDate()).padStart(2,'0')}`:'未安排'}
function range(a,b){return `${md(a)} — ${md(b)}`}
const periodLabel=d=>d==='month'?'一个月':d==='7'?'一周':'两周';
let seq=0;const uid=prefix=>`${prefix}-${Date.now().toString(36)}-${++seq}`;
let state;let ui={page:'week',week:monday(TODAY),planId:null,planFilter:'all',recordTab:'pending',query:'',captureKind:'todo'};
const planBy=id=>state.plans.find(p=>p.id===id),taskBy=id=>state.tasks.find(t=>t.id===id),noteBy=id=>state.notes.find(n=>n.id===id);
function stage(p){return p.closed?'ended':p.end<TODAY?'review':p.start>TODAY?'upcoming':'active'}
function stageText(p){return {active:'进行中',review:'待回顾',ended:'已结束',upcoming:'即将开始'}[stage(p)]}
function stageBadge(p){return `<span class="status ${stage(p)}"><span class="dot"></span>${stageText(p)}</span>`}
const sample=x=>x.sample?'<span class="tag">示例</span>':'';
function planTasks(p){return state.tasks.filter(t=>t.planId===p.id)}
function stats(p){const ts=planTasks(p),done=ts.filter(t=>t.done),timed=done.filter(t=>t.minutes!==null&&t.minutes!==undefined&&t.minutes!=='');return {total:ts.length,done:done.length,percent:ts.length?Math.round(done.length/ts.length*100):0,minutes:timed.reduce((n,t)=>n+Number(t.minutes),0),timed:timed.length,missing:done.length-timed.length}}
function makeTask(plan,week){return {id:uid('task'),planId:plan.id,title:plan.actionTitle||'跑步练习',week,date:'',time:'',done:false,doneAt:null,minutes:null,feeling:'',created:TODAY,sample:!!plan.sample}}
function generateTasks(p){for(let w=monday(p.start);w<=p.end;w=addDays(w,7))for(let n=0;n<p.frequency;n++)state.tasks.push(makeTask(p,w))}
function seed(){seq=0;state={plans:[],tasks:[],notes:[]};const active={id:'running',title:'给跑步一个月的时间',actionTitle:'跑步练习',reason:'想知道跑步能否自然地融入我的生活，也想为未来的马拉松打下基础。先感受时间和精力的投入，再决定怎样继续。',start:addDays(TODAY,-12),duration:'month',frequency:3,expectedMinutes:40,sample:true,closed:false,review:null};active.end=endDate(active.start,active.duration);state.plans.push(active);generateTasks(active);const grouped={};planTasks(active).forEach(t=>(grouped[t.week]??=[]).push(t));for(const [w,ts]of Object.entries(grouped)){ts.forEach((t,i)=>{if(w>monday(TODAY))return;let d=addDays(w,[0,2,5][i]);if(d<active.start)d=active.start;if(d>active.end)d=active.end;if(w===monday(TODAY)&&i===2)return;t.date=d;t.time='07:00';if(d<TODAY){t.done=true;t.doneAt=d+'T08:00:00+08:00';t.minutes=i===1?null:35+i*5;t.feeling=i===0?'跑完精神很好，早起比想象中容易。':''}})}
const old={id:'reading',title:'睡前，把时间留给阅读',actionTitle:'睡前阅读',reason:'试着在睡前留一点安静的时间，看看阅读能不能成为自然的睡前习惯。',start:addDays(monday(TODAY),-21),end:addDays(monday(TODAY),-8),duration:'14',frequency:3,expectedMinutes:20,sample:true,closed:false,review:null};state.plans.push(old);generateTasks(old);planTasks(old).forEach((t,i)=>{t.date=addDays(t.week,[0,2,4][i%3]);t.time='22:00';t.done=i<4;t.doneAt=t.done?t.date+'T22:25:00+08:00':null;t.minutes=t.done?(i===1?null:20):null;t.feeling=i===0?'把手机放远一点，读书时安静了很多。':i===3?'工作很晚的那天，二十分钟也有一点勉强。':''});
state.tasks.push({id:'buy',planId:null,title:'研究一副适合跑步的耳机',date:'',time:'',week:monday(TODAY),done:false,doneAt:null,minutes:null,feeling:'',source:'',created:TODAY,sample:true},{id:'article',planId:null,title:'读完收藏的那篇文章',date:addDays(monday(TODAY),4),time:'20:30',week:monday(TODAY),done:false,doneAt:null,minutes:null,feeling:'',source:'',created:addDays(TODAY,-2),sample:true});
state.notes.push({id:'teamwork',content:'不必每件事都独自完成。想给自己更多与别人协作的机会，学着一起把事情做好。',created:addDays(TODAY,-1),source:'',planId:'',sample:true},{id:'slow',content:'长期的变化，可能就藏在这些不起眼的小步里。先找到舒服的节奏，再谈坚持。',created:addDays(TODAY,-3),source:'',planId:'running',sample:true});}
function taskSort(a,b){return (a.time||'99').localeCompare(b.time||'99')||a.title.localeCompare(b.title)}
function button(action,label,cls='btn',extra='',ico=''){return `<button type="button" class="${cls}" data-action="${action}" ${extra}>${ico?icon(ico,16):''}${label}</button>`}
function empty(title,sub='',ico='leaf'){return `<div class="empty">${icon(ico,26)}<strong>${title}</strong>${sub}</div>`}
function render(){const active=state.plans.filter(p=>['active','upcoming'].includes(stage(p)));$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">${icon('leaf',24)}</span><span class="brand-word">field</span></div><div class="brand-sub">LIFE IN PROGRESS</div>${button('new-note','随手记一笔','btn quick','','plus')}<nav class="nav" aria-label="主导航">${[['week','calendar','本周'],['plans','flag','考察计划'],['notes','notes','随手记']].map(([k,i,t])=>`<button class="nav-item ${ui.page===k?'active':''}" data-action="nav" data-page="${k}" ${ui.page===k?'aria-current="page"':''}>${icon(i,18)}${t}${k==='notes'?`<span class="pill">${state.tasks.filter(t=>!t.planId&&!t.done).length}</span>`:''}</button>`).join('')}</nav><div class="side-label">正在慢慢成为习惯</div>${active.slice(0,4).map(p=>`<button class="side-plan" data-action="open-plan" data-id="${p.id}"><span class="dot"></span><span class="grow">${esc(p.title)}</span>${icon('arrow',12)}</button>`).join('')}${!active.length?'<div class="small muted" style="padding:0 12px">给一个想法，一点时间。</div>':''}<div class="side-quote"><div class="sprig">${icon('leaf',26)}</div>不急着成为理想中的自己。<br>先过好这一小段。</div><div class="side-footer"><span class="avatar">我</span><div class="grow"><div style="font-size:11px">我的生活空间</div><div style="font-size:9px;color:#9aA18e">一点一点，慢慢来</div></div><button class="icon-btn" data-action="help" aria-label="原型使用说明">${icon('info',17)}</button></div></aside><main class="main"><div class="topbar"><span class="breadcrumb">我的生活空间 ${icon('arrow',11)} <span>${{week:'本周',plans:'考察计划',notes:'随手记'}[ui.page]}</span></span><div class="prototype-note"><span class="dot"></span><span>交互原型<span class="notice-full"> · 数据仅保留在当前页面，刷新会重置</span></span><button class="text-btn" data-action="reset">重置</button></div></div>${ui.page==='week'?weekView():ui.page==='plans'?(ui.planId?planDetail(planBy(ui.planId)):plansView()):notesView()}<div class="footer-note">留一点空间，给正在发生的生活。</div></main></div>`;}
function bannerArt(){return `<svg class="banner-art" viewBox="0 0 160 80" fill="none" aria-hidden="true"><path d="M5 64c22 8 25-20 49-15s24 25 48 8 21-12 50-14" stroke="#9dac86" stroke-width="1.3" stroke-dasharray="3 5"/><path d="M77 65c5-16 8-35 4-51M82 34c-15 2-23-7-23-18 14-3 24 6 23 18ZM82 45c15 3 25-8 24-19-16-2-24 8-24 19Z" stroke="#83986d" stroke-width="1.5"/><circle cx="131" cy="18" r="10" fill="#e2d9a5"/><path d="m14 31 3-7 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z" stroke="#a9b696"/></svg>`}
function taskCard(t){const p=planBy(t.planId);return `<article class="task-card ${t.planId?'':'todo'} ${t.done?'done':''}" draggable="true" data-drag="${t.id}" data-action="edit-task" data-id="${t.id}" tabindex="0" role="button" aria-label="编辑${esc(t.title)}"><div class="task-top"><span class="task-time">${t.time||'灵活安排'}</span><button class="check ${t.done?'on':''}" data-action="toggle-task" data-id="${t.id}" aria-label="${t.done?'撤销完成':'完成'}${esc(t.title)}" aria-pressed="${t.done}">${t.done?icon('check',12):''}</button></div><div class="task-title">${esc(t.title)}</div><div class="task-bottom">${p?icon('leaf',10):icon('notes',10)}${p?'考察行动':'生活待办'}${sample(t)}</div></article>`}
function pendingTasks(){return state.tasks.filter(t=>!t.date&&!t.done&&(!t.planId||t.week===ui.week))}
function pendingCard(t){return `<div class="pending-card" draggable="true" data-drag="${t.id}"><span class="grip">${icon('grip',13)}</span><div class="grow"><div class="pending-name">${esc(t.title)} ${sample(t)}</div><div class="pending-meta">${t.planId?'本周考察行动':'先记下，慢慢处理'}</div></div><button class="icon-btn" data-action="edit-task" data-id="${t.id}" aria-label="安排${esc(t.title)}">${icon('calendar',15)}</button></div>`}
function miniPlan(p){const s=stats(p);return `<button class="plan-mini" data-action="open-plan" data-id="${p.id}"><div class="row"><span class="plan-icon ${stage(p)==='review'?'amber':''}">${icon(p.id==='reading'?'book':'leaf',19)}</span><div class="grow"><h3>${esc(p.title)}</h3><div class="small muted" style="font-size:10px">${range(p.start,p.end)} ${sample(p)}</div></div>${stageBadge(p)}</div><p class="mini-reason">${esc(p.reason)}</p><div class="progress"><span style="width:${s.percent}%"></span></div><div class="row between mini-progress-label"><span>已完成 ${s.done} / ${s.total} 次行动</span><span>${stage(p)==='review'?'留一点时间，回头看看':`每周 ${p.frequency} 次`}${icon('arrow',11)}</span></div></button>`}
function weekView(){const days=Array.from({length:7},(_,i)=>addDays(ui.week,i)),pending=pendingTasks(),active=state.plans.filter(p=>['active','upcoming','review'].includes(stage(p))).slice(0,2);return `<div class="page-heading"><div><div class="heading-kicker">A LITTLE MORE LIKE YOU</div><h1>把想法，过成生活。</h1><p>安排一些行动，也给生活留一点余地。</p></div>${button('new-plan','新的考察计划','btn primary','','plus')}</div><div class="intro-banner"><div class="banner-copy"><h2 class="serif">不必一下子走很远，先走过这一周。</h2><p>尝试、感受，再找到适合自己的节奏。</p></div>${bannerArt()}${button('nav','看看我的计划','btn ghost','data-page="plans"','arrow')}</div><div class="week-layout"><section><div class="calendar-shell"><div class="calendar-toolbar"><div class="row"><h2>${dateObj(ui.week).getFullYear()}年 ${dateObj(ui.week).getMonth()+1}月</h2><span class="week-range">${range(ui.week,days[6])}</span></div><div class="row" style="gap:5px"><button class="icon-btn" data-action="week-prev" aria-label="上一周">${icon('left',16)}</button>${button('week-today','本周','btn small ghost')}<button class="icon-btn" data-action="week-next" aria-label="下一周">${icon('arrow',16)}</button></div></div><div class="calendar">${days.map((d,i)=>`<section class="day ${d===TODAY?'today':''}" data-drop-date="${d}" aria-label="${md(d)}"><div class="day-head"><span class="day-name">${d===TODAY?'今天':['周一','周二','周三','周四','周五','周六','周日'][i]}</span><span class="day-num">${dateObj(d).getDate()}</span></div>${state.tasks.filter(t=>t.date===d).sort(taskSort).map(taskCard).join('')}<button class="day-add" data-action="new-note" data-date="${d}" aria-label="在${md(d)}添加待办">${icon('plus',12)} 添加</button></section>`).join('')}</div><div class="calendar-legend"><span class="row" style="gap:5px"><span class="legend-dot"></span>考察行动</span><span class="row" style="gap:5px"><span class="legend-dot yellow"></span>生活待办</span><span class="grow"></span>${icon('grip',12)} 拖动调整日期 · 点击填写感受</div></div><div class="mobile-banner"><span class="small muted">待安排 ${pending.length} 项</span>${pending.map(t=>button('edit-task',esc(t.title),'btn small',`data-id="${t.id}"`,'calendar')).join('')}</div><div class="active-section"><div class="section-head"><h2>给改变一点时间 <span>我的考察计划</span></h2><button class="text-btn" data-action="nav" data-page="plans">查看全部 ${icon('arrow',13)}</button></div><div class="plan-mini-grid">${active.map(miniPlan).join('')||button('new-plan','开始一次小小的尝试','new-plan-card','','plus')}</div></div></section><aside class="pending-panel"><div class="row between"><h2 class="pending-title">还没安排的事 <span class="pill">${pending.length}</span></h2><button class="icon-btn" data-action="new-note" aria-label="添加待办">${icon('plus',17)}</button></div><p class="pending-description">先放在这里，时间合适了再出发。</p><div class="pending-list" data-drop-pending="true">${pending.map(pendingCard).join('')||empty('这一周，已经安排妥当','新想法可以随时记下来。')}</div><div class="pending-bottom">${icon('grip',13)} 拖入日历，或点日期图标安排<br><span style="padding-left:18px">也可以把日历中的行动拖回这里。</span></div>${state.notes.length?`<button class="quote-card" data-action="edit-note" data-id="${state.notes[0].id}"><div class="quote-mark">“</div><div>${esc(state.notes[0].content)}</div><div class="quote-foot">过去的自己，留下一点提醒 ${sample(state.notes[0])}</div></button>`:''}</aside></div>`}
function plansView(){const plans=state.plans.filter(p=>ui.planFilter==='all'||(ui.planFilter==='active'?['active','upcoming'].includes(stage(p)):stage(p)===ui.planFilter));return `<div class="page-heading"><div><div class="heading-kicker">TRY A WAY OF LIVING</div><h1>给改变一点时间。</h1><p>先试一小段，再决定以怎样的节奏继续。</p></div>${button('new-plan','新的考察计划','btn primary','','plus')}</div><div class="tabs" role="group" aria-label="计划筛选">${[['all','全部计划'],['active','进行中 / 即将开始'],['review','待回顾'],['ended','已结束']].map(([v,l])=>button('plan-filter',l,`tab ${ui.planFilter===v?'active':''}`,`data-value="${v}" aria-pressed="${ui.planFilter===v}"`)).join('')}</div><div class="plans-grid">${plans.map(p=>{const s=stats(p);return `<article class="plan-card" role="button" tabindex="0" data-action="open-plan" data-id="${p.id}"><div class="row between"><div class="row"><span class="plan-icon ${stage(p)==='review'?'amber':''}">${icon(p.id==='reading'?'book':'leaf',20)}</span>${sample(p)}</div>${stageBadge(p)}</div><h2>${esc(p.title)}</h2><p class="reason">${esc(p.reason)}</p><div class="dates">${icon('calendar',13)} ${range(p.start,p.end)} · 每周 ${p.frequency} 次</div><div class="progress"><span style="width:${s.percent}%"></span></div><div class="card-foot"><span>完成 ${s.done} / ${s.total} 次行动</span><span>${p.closed?'查看这段经历':stage(p)==='review'?'回头看看':'进入计划'} ${icon('arrow',12)}</span></div></article>`}).join('')}<button class="new-plan-card" data-action="new-plan">${icon('plus',25)}<span>还有什么，是你想试试的？</span><span class="small muted">从一周、两周或一个月开始</span></button></div>`}
function taskRow(t){return `<div class="action-row ${t.done?'done':''}"><button class="check ${t.done?'on':''}" data-action="toggle-task" data-id="${t.id}" aria-label="${t.done?'撤销完成':'完成'}${esc(t.title)}">${t.done?icon('check',12):''}</button><div class="grow"><button class="title-button" data-action="edit-task" data-id="${t.id}"><div class="title">${esc(t.title)} ${sample(t)}</div><div class="description">${t.date?md(t.date)+(t.time?' · '+t.time:' · 当天灵活完成'):'尚未安排日期'}${t.done?' · 已完成':''}${t.done&&t.minutes!==null?' · '+t.minutes+' 分钟':''}</div></button>${t.feeling?`<div class="task-inline-note">${esc(t.feeling)}</div>`:''}</div><button class="icon-btn" data-action="edit-task" data-id="${t.id}" aria-label="编辑行动">${icon('edit',15)}</button><button class="icon-btn" data-action="delete-task" data-id="${t.id}" aria-label="删除${esc(t.title)}">${icon('trash',14)}</button></div>`}
function planDetail(p){if(!p){ui.planId=null;return plansView()}const s=stats(p),ts=planTasks(p),weeks=[...new Set(ts.map(t=>t.week))].sort(),notes=state.notes.filter(n=>n.planId===p.id),elapsed=Math.max(0,Math.min(diffDays(TODAY,p.start)+1,diffDays(p.end,p.start)+1));return `${button('plans-back',`${icon('left',14)} 所有考察计划`,'text-btn back')}<div class="page-heading"><div><div class="heading-kicker">ONE SMALL EXPERIMENT</div><h1>${esc(p.title)}</h1><p>${range(p.start,p.end)} · ${periodLabel(p.duration)}的尝试 ${sample(p)}</p></div>${stageBadge(p)}</div><div class="detail-layout"><section><div class="reason-box"><div class="eyebrow">为什么开始</div><p>${esc(p.reason||'给这个想法一点时间，看看它怎样融入生活。')}</p></div><div class="panel"><div class="section-head"><h2>一步一步地实践</h2>${button('add-action','添加行动','btn small',`data-id="${p.id}"`,'plus')}</div><p class="help" style="margin:-5px 0 20px">每周计划 ${p.frequency} 次${p.expectedMinutes?`，预计每次 ${p.expectedMinutes} 分钟`:''}。首尾不足一周的行动，可以按实际情况增减。</p>${weeks.map(w=>`<div class="week-group"><h3>${range(w<p.start?p.start:w,addDays(w,6)>p.end?p.end:addDays(w,6))}${w===monday(TODAY)?' · 本周':''}</h3>${ts.filter(t=>t.week===w).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||taskSort(a,b)).map(taskRow).join('')}</div>`).join('')||empty('先添加一个小小的行动')}</div>${notes.length?`<div class="panel linked-notes"><h3>这段时间留下的感受</h3>${notes.map(n=>`<button class="note-preview" data-action="edit-note" data-id="${n.id}">${esc(n.content)} <span class="muted">· ${md(n.created)}</span></button>`).join('')}</div>`:''}</section><aside class="detail-sidebar"><div class="panel"><div class="eyebrow">实际发生了什么</div><div class="info-grid" style="grid-template-columns:1fr 1fr"><div><span class="muted">已完成行动</span><strong>${s.done}<span style="font-size:13px;color:#99a18d"> / ${s.total}</span></strong></div><div><span class="muted">已记录耗时</span><strong>${s.timed?s.minutes:'—'}<span style="font-size:12px;color:#99a18d"> 分钟</span></strong></div></div><div class="progress"><span style="width:${s.percent}%"></span></div><p class="help" style="margin-top:12px">${s.timed?`${s.timed} 次填写了耗时`:'还没有耗时记录'}${s.missing?`，${s.missing} 次已完成行动未填写。`:'。'}<br>未填写不计作零，也不影响完成状态。</p><div class="divider"></div><div class="row between small"><span class="muted">考察期已走过</span><span>${elapsed} / ${diffDays(p.end,p.start)+1} 天</span></div><p class="help">这是时间的经过，不是对你的评分。</p></div><div class="panel review-panel" style="margin-top:20px"><div class="row">${icon('sun',19)}<h3>${p.closed?'留给下一段生活':'留一点时间，回头看看'}</h3></div><p>${p.closed?'这段经历已经留下。可以随时回来，看看自己当时的理解。':stage(p)==='review'?'这一段考察已经结束。除了做了多少，也听听自己的感受。':'完成多少只是一个侧面。这样的投入，适合现在的生活吗？'}</p>${p.review?`<div class="review-copy">${esc(p.review.text||'已记录本阶段的决定。')}</div><div class="small muted" style="margin:12px 0">${md(p.review.date)} · ${{continue:'继续当前节奏',adjust:'调整投入',finish:'告一段落',save:'回顾草稿'}[p.review.decision]||'回顾'}</div>`:''}${button('review',p.review?'查看 / 编辑回顾':stage(p)==='review'?'回顾这段尝试':'记录阶段感受','btn',`data-id="${p.id}"`,'notes')}${p.nextId?button('open-plan','看看下一周期','btn ghost full-width',`data-id="${p.nextId}" style="margin-top:9px"`,'arrow'):''}</div>${p.parentId?`<div class="related-note">${button('open-plan','回看上一周期','text-btn',`data-id="${p.parentId}"`,'left')}</div>`:''}</aside></div>`}
function safeUrl(s){try{const u=new URL(s);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function sourceLink(s){const u=safeUrl(s);return u?`<a class="source-link" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${icon('link',11)} 原始来源</a>`:''}
function recordList(){const q=ui.query.toLocaleLowerCase(),isNotes=ui.recordTab==='reflections';if(isNotes){const ns=state.notes.filter(n=>n.content.toLocaleLowerCase().includes(q)).sort((a,b)=>b.created.localeCompare(a.created));return ns.map(n=>`<article class="record-item reflection-item"><div class="row between"><span class="reflection-icon">${icon('spark',18)}</span><button class="icon-btn" data-action="edit-note" data-id="${n.id}" aria-label="编辑感受">${icon('edit',15)}</button></div><div class="content">${esc(n.content)}</div><div class="meta"><span>${md(n.created)}</span>${sample(n)}${n.planId&&planBy(n.planId)?button('open-plan',esc(planBy(n.planId).title),'text-btn',`data-id="${n.planId}"`,'leaf'):''}${sourceLink(n.source)}</div></article>`).join('')||empty(q?'没有找到这段感受':'留住那个被触动的瞬间',q?'换个关键词试试。':'无需整理完整，先记下来就好。','spark')}
const ts=state.tasks.filter(t=>!t.planId&&t.done===(ui.recordTab==='completed')&&t.title.toLocaleLowerCase().includes(q)).sort((a,b)=>b.created.localeCompare(a.created));return ts.map(t=>`<article class="record-item ${t.done?'done':''}"><button class="check ${t.done?'on':''}" data-action="toggle-task" data-id="${t.id}" aria-label="${t.done?'撤销完成':'完成'}${esc(t.title)}">${t.done?icon('check',12):''}</button><div class="grow"><div class="content">${esc(t.title)}</div><div class="meta"><span>${md(t.created)} 记下</span>${sample(t)}${button('edit-task',t.date?md(t.date)+(t.time?' '+t.time:''):'安排日期','text-btn',`data-id="${t.id}"`,'calendar')}${sourceLink(t.source)}</div></div><button class="icon-btn" data-action="edit-task" data-id="${t.id}" aria-label="编辑待办">${icon('edit',15)}</button></article>`).join('')||empty(q?'没有找到这件事':ui.recordTab==='completed'?'完成的小事，会留在这里':'暂时没有待处理的事',q?'换个关键词试试。':'想到什么，就先记下。','notes')}
function notesView(){return `<div class="page-heading"><div><div class="heading-kicker">A PLACE FOR WHAT CROSSES YOUR MIND</div><h1>先记下，不急着安排。</h1><p>待办、感受，还有那些不想忘记的小小瞬间。</p></div></div><div class="record-layout"><section><form class="capture-box" id="quick-form"><div class="segmented" role="group" aria-label="记录类型"><button type="button" data-action="capture-kind" data-value="todo" class="${ui.captureKind==='todo'?'active':''}">${icon('check',12)} 一件待办</button><button type="button" data-action="capture-kind" data-value="reflection" class="${ui.captureKind==='reflection'?'active':''}">${icon('spark',12)} 一点感受</button></div><label class="visually-hidden" for="quick-content">随手记内容</label><textarea id="quick-content" name="content" placeholder="${ui.captureKind==='todo'?'想买的东西、想查的资料，或某个还没空做的小事……':'刚才读到、听到，或突然意识到的事……'}" required maxlength="5000"></textarea><div class="row between"><button class="text-btn" type="button" data-action="expand-note">${icon('plus',13)} 添加日期、来源或关联</button><button class="btn primary small" type="submit">记下来了 ${icon('arrow',13)}</button></div></form><div class="records-toolbar"><div class="tabs" role="group" aria-label="记录筛选">${[['pending','待处理'],['completed','已完成'],['reflections','我的感受']].map(([v,l])=>button('record-tab',l,`tab ${ui.recordTab===v?'active':''}`,`data-value="${v}" aria-pressed="${ui.recordTab===v}"`)).join('')}</div><label class="search">${icon('search',14)}<span class="visually-hidden">搜索记录</span><input id="record-search" type="search" placeholder="找回一个念头" value="${esc(ui.query)}"></label></div><div id="records-list">${recordList()}</div></section><aside class="inbox-aside">${icon('leaf',30)}<h3 class="serif">让脑海腾出一点空间。</h3><p>有些事情值得记住，<br>但不必现在就处理。</p><div class="step"><span class="step-number">01</span><div>先接住一个念头<p>一句话就够了，不需要日期。</p></div></div><div class="step"><span class="step-number">02</span><div>有空时，再回来看看<p>安排一件待办，或重读一段感受。</p></div></div><div class="step"><span class="step-number">03</span><div>慢慢与生活连起来<p>把感受关联到正在尝试的计划。</p></div></div><div class="divider"></div><p>这里的感受可以只是一段感受，<br>不必变成另一个要完成的任务。</p></aside></div>`}
const modal=$('#modal');
function openModal(title,subtitle,body){modal.innerHTML=`<div class="modal-head"><div><h2 id="modal-title">${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div><button class="icon-btn" data-action="close-modal" aria-label="关闭">${icon('close',19)}</button></div><div class="modal-body">${body}</div>`;if(!modal.open)modal.showModal();modal.scrollTop=0;}
function closeModal(){modal.close();modal.innerHTML=''}
function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('show'),2900)}
function formError(form,text){let el=form.querySelector('.error');if(!el){el=document.createElement('div');el.className='error';el.setAttribute('role','alert');form.prepend(el)}el.textContent=text;el.scrollIntoView({block:'nearest'})}
function field(label,name,type,value='',extra=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function periodOptions(value='14'){return [['7','一周'],['14','两周'],['month','一个月']].map(([v,t])=>`<option value="${v}" ${v===value?'selected':''}>${t}</option>`).join('')}
function planOptions(value=''){return `<option value="">暂不关联</option>`+state.plans.map(p=>`<option value="${p.id}" ${value===p.id?'selected':''}>${esc(p.title)}${p.closed?'（已结束）':''}</option>`).join('')}
function newPlan(){openModal('给一个想法，一段时间。','先尝试，再找到适合自己的投入方式。',`<form id="plan-form">${field('这次想尝试什么','title','text','','required maxlength="80" placeholder="例如：给跑步两周的时间"')}<div class="field"><label for="f-reason">为什么想开始 <span>· 可选</span></label><textarea id="f-reason" name="reason" placeholder="希望这次尝试，帮你回答什么问题？" maxlength="3000"></textarea></div><div class="fields">${field('开始日期','start','date',TODAY,'required')}<div class="field"><label for="f-duration">考察多久</label><select id="f-duration" name="duration">${periodOptions()}</select></div></div><div id="period-preview" class="form-info"></div><div class="fields">${field('每周计划几次','frequency','number','3','required min="1" max="14" step="1"')}${field('预计每次多少分钟 <span>· 可选</span>','expectedMinutes','number','','min="1" max="1440" step="1" placeholder="只作参考，不是要求"')}</div>${field('每次行动的名称','actionTitle','text','','required maxlength="80" placeholder="例如：跑步练习"')}<p class="help">按每个覆盖到的自然周生成待安排行动。首尾不足一周，也可以进入计划后增减。</p><div class="modal-footer">${button('close-modal','再想想','btn ghost')}<button class="btn primary" type="submit">开始这段尝试 ${icon('arrow',15)}</button></div></form>`);updatePeriodPreview();}
function updatePeriodPreview(){const form=$('#plan-form');if(!form)return;const start=form.elements.start.value,duration=form.elements.duration.value;$('#period-preview').textContent=start?`${range(start,endDate(start,duration))} · 共 ${diffDays(endDate(start,duration),start)+1} 天`:'请选择开始日期';}
function noteModal(kind='todo',date='',id='',draft=''){const n=id?noteBy(id):null;if(n)kind='reflection';openModal(n?'回到这个念头':'接住一个念头','不必想得很完整，先留给以后的自己。',`<form id="note-form" data-id="${id}"><div class="choice-group"><label class="choice"><input type="radio" name="kind" value="todo" ${kind==='todo'?'checked':''} ${n?'disabled':''}>一件待办</label><label class="choice"><input type="radio" name="kind" value="reflection" ${kind==='reflection'?'checked':''}>一点感受</label></div><div class="field"><label for="f-content">${kind==='todo'?'想做的事':'想留下的感受'}</label><textarea name="content" id="f-content" required maxlength="5000" style="min-height:130px" placeholder="此刻脑海里的那个念头……">${esc(n?n.content:draft)}</textarea></div><div id="note-todo-fields" ${kind==='reflection'?'hidden':''}><div class="fields">${field('安排日期 <span>· 可选</span>','date','date',date)}${field('具体时间 <span>· 可选</span>','time','time')}</div></div><div id="note-reflection-fields" ${kind==='todo'?'hidden':''}><div class="field"><label for="f-planId">关联考察计划 <span>· 可选</span></label><select id="f-planId" name="planId">${planOptions(n?.planId)}</select></div></div>${field('来源链接 <span>· 可选</span>','source','url',n?.source||'','placeholder="https://…"')}${n?`<div class="note-date">${md(n.created)} 记录 ${sample(n)}</div>`:''}<div class="modal-footer">${n?button('delete-note','删除','btn ghost danger',`data-id="${id}"`):''}<span class="grow"></span>${button('close-modal','取消','btn ghost')}<button class="btn primary" type="submit">${n?'保存这个念头':'记下来了'}</button></div></form>`);}
function taskModal(id){const t=taskBy(id);if(!t)return;const p=planBy(t.planId);openModal(t.planId?'一次小小的行动':'慢慢处理这件事',p?`${esc(p.title)} · ${range(p.start,p.end)}`:'可以安排时间，也可以先放在待办里。',`<form id="task-form" data-id="${id}"><div class="field"><label for="f-title">${p?'行动名称':'待办内容'}</label><textarea id="f-title" name="title" required maxlength="5000">${esc(t.title)}</textarea></div><div class="fields">${field('安排日期 <span>· 留空则待安排</span>','date','date',t.date,p?`min="${p.start}" max="${p.end}"`:'')}${field('具体时间 <span>· 可选</span>','time','time',t.time)}</div>${p?`<p class="help">可安排在考察期内任意一天。跨周改期会移动到对应周，不会新增一条行动。</p>`:field('来源链接 <span>· 可选</span>','source','url',t.source||'','placeholder="https://…"')}<div class="completion-box"><label class="completion-label"><input type="checkbox" name="done" ${t.done?'checked':''}>这次已经完成</label><div class="help" style="margin-bottom:15px">只打勾就可以。时间和感受，想记的时候再记。</div>${t.doneAt?`<div class="completed-on">完成记录：${md(localStamp(t.doneAt))} · 调整安排日期不会改变这条记录</div>`:''}${field('实际耗时（分钟）<span>· 可选</span>','minutes','number',t.minutes??'','min="0" max="1440" step="1" placeholder="未填写不会计作零"')}<div class="field"><label for="f-feeling">做完之后，感觉如何 <span>· 可选</span></label><textarea id="f-feeling" name="feeling" maxlength="3000" placeholder="精力、时间，或一点点感受……">${esc(t.feeling)}</textarea></div></div><div class="modal-footer">${button('delete-task','删除','btn ghost danger',`data-id="${id}"`)}<span class="grow"></span>${button('close-modal','取消','btn ghost')}<button class="btn primary" type="submit">保存</button></div></form>`);}
function addActionModal(id){const p=planBy(id);const weeks=[];for(let w=monday(p.start);w<=p.end;w=addDays(w,7))weeks.push(w);openModal('给计划加一步','增加一条行动，不改变原先的每周投入设想。',`<form id="action-form" data-id="${id}">${field('行动名称','title','text',p.actionTitle,'required maxlength="80"')}<div class="field"><label for="f-week">放在哪一周</label><select id="f-week" name="week">${weeks.map(w=>`<option value="${w}" ${w===monday(TODAY)?'selected':''}>${range(w<p.start?p.start:w,addDays(w,6)>p.end?p.end:addDays(w,6))}</option>`).join('')}</select></div><div class="modal-footer">${button('close-modal','取消','btn ghost')}<button class="btn primary" type="submit">添加到待安排</button></div></form>`);}
function reviewModal(id){const p=planBy(id),s=stats(p),feedback=[...planTasks(p).filter(t=>t.feeling),...state.notes.filter(n=>n.planId===p.id).map(n=>({feeling:n.content,date:n.created}))],start=p.end<TODAY?TODAY:addDays(p.end,1);openModal('这段尝试，适合现在的你吗？','完成情况只是一个侧面，也听听自己的感受。',`<form id="review-form" data-id="${id}"><div class="form-stat"><span><strong>${s.done} / ${s.total}</strong> 次行动</span><span><strong>${s.timed?s.minutes:'—'}</strong> 分钟已记录</span><span class="muted">${s.missing} 次完成未填耗时</span></div>${feedback.length?`<div class="label">当时留下的感受</div><div class="review-feedback">${feedback.map(t=>`<p>${esc(t.feeling)} <span class="muted">· ${t.date?md(t.date):'未安排日期'}</span></p>`).join('')}</div>`:''}<div class="field"><label for="f-reviewText">回头看，这段时间怎么样？</label><textarea id="f-reviewText" name="reviewText" maxlength="5000" style="min-height:115px" placeholder="时间和精力够用吗？哪些部分舒服，哪些需要调整？">${esc(p.review?.text||'')}</textarea></div>${!p.closed?`<div class="label">接下来，我想……</div><div class="choice-group"><label class="choice"><input type="radio" name="decision" value="continue">继续当前节奏</label><label class="choice"><input type="radio" name="decision" value="adjust" checked>调整投入</label><label class="choice"><input type="radio" name="decision" value="finish">先告一段落</label></div><div class="new-period" id="new-period"><div class="fields">${field('下一周期开始日期','start','date',start,`required min="${addDays(p.end,1)}"`)}<div class="field"><label for="f-duration">下一周期时长</label><select name="duration" id="f-duration">${periodOptions(p.duration)}</select></div></div><div class="fields">${field('每周计划次数','frequency','number',p.frequency,'required min="1" max="14" step="1"')}${field('预计每次分钟 <span>· 可选</span>','expectedMinutes','number',p.expectedMinutes??'','min="1" max="1440" step="1"')}</div><p class="help">原周期的安排和回顾会保留，下一周期会单独创建。</p></div>`:`<div class="form-info">已记录决定：${{continue:'继续当前节奏',adjust:'调整投入',finish:'告一段落'}[p.review?.decision]||'本周期已结束'}。${p.nextId?'下一周期已创建，编辑回顾不会重复创建。':''}</div>`}<div class="modal-footer">${button('close-modal','取消','btn ghost')}<button class="btn" type="submit" name="mode" value="save">${p.closed?'保存回顾':'先保存回顾'}</button>${!p.closed?'<button class="btn primary" type="submit" name="mode" value="decide">确认下一步</button>':''}</div></form>`);}
function confirmDelete(type,id){openModal(type==='task'?'移除这件事？':'移除这段感受？','这只会影响当前原型里的记录。',`<p class="small muted">${type==='task'?'移除后，它会同时从日历、待办或计划中消失。':'移除后，关联计划里也不再展示这段感受。'}</p><div class="modal-footer">${button('close-modal','保留','btn ghost')}${button('confirm-delete','确认移除','btn danger',`data-type="${type}" data-id="${id}"`)}</div>`)}
function toggleTask(id){const t=taskBy(id);if(!t)return;t.done=!t.done;t.doneAt=t.done?new Date().toISOString():null;render();toast(t.done?'这一步，已经走过了。想记感受时，可以点开行动。':'已撤销完成，安排和感受仍然保留。')}
function changeTaskDate(id,date){const t=taskBy(id);if(!t)return;const p=planBy(t.planId);if(date&&p&&(date<p.start||date>p.end)){toast('请安排在这项计划的考察期内。');return}if(!date&&p&&(addDays(ui.week,6)<p.start||ui.week>p.end)){toast('当前周不在考察期内，请切换到计划所在周。');return}t.date=date;if(date)t.week=monday(date);else{t.time='';t.week=ui.week}render();toast(date?`已安排到 ${md(date)}${t.done?'，完成记录保持不变。':'。'}`:'已放回本周待安排。')}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;switch(a){case'nav':ui.page=b.dataset.page;ui.planId=null;render();break;case'new-plan':newPlan();break;case'new-note':noteModal('todo',b.dataset.date||'');break;case'close-modal':closeModal();break;case'week-prev':ui.week=addDays(ui.week,-7);render();break;case'week-next':ui.week=addDays(ui.week,7);render();break;case'week-today':ui.week=monday(TODAY);render();break;case'open-plan':ui.page='plans';ui.planId=id;if(modal.open)closeModal();render();window.scrollTo({top:0});break;case'plans-back':ui.planId=null;render();break;case'plan-filter':ui.planFilter=b.dataset.value;render();break;case'edit-task':taskModal(id);break;case'toggle-task':event.stopPropagation();toggleTask(id);break;case'edit-note':noteModal('reflection','',id);break;case'add-action':addActionModal(id);break;case'delete-task':confirmDelete('task',id);break;case'delete-note':confirmDelete('note',id);break;case'confirm-delete':if(b.dataset.type==='task')state.tasks=state.tasks.filter(t=>t.id!==id);else state.notes=state.notes.filter(n=>n.id!==id);closeModal();render();toast('已移除。');break;case'review':reviewModal(id);break;case'record-tab':{const draft=$('#quick-content')?.value||'';ui.recordTab=b.dataset.value;render();$('#quick-content').value=draft;break}case'capture-kind':{const draft=$('#quick-content').value;ui.captureKind=b.dataset.value;render();$('#quick-content').value=draft;break}case'expand-note':noteModal(ui.captureKind,'','',$('#quick-content').value);break;case'reset':openModal('重新开始体验？','你在当前页面新增和修改的内容将被清除。',`<p class="small muted">恢复跑步考察、阅读回顾和随手记的示例数据。</p><div class="modal-footer">${button('close-modal','保留当前内容','btn ghost')}${button('confirm-reset','恢复示例','btn primary')}</div>`);break;case'confirm-reset':seed();ui={page:'week',week:monday(TODAY),planId:null,planFilter:'all',recordTab:'pending',query:'',captureKind:'todo'};closeModal();render();toast('已恢复示例，可以重新尝试。');break;case'help':openModal('欢迎来到「field」','一个帮助你尝试、记录与回顾生活的交互原型。',`<ul class="help-list"><li>在「本周」拖动行动安排日期，或点击行动编辑。</li><li>在「考察计划」创建一周、两周或一个月的尝试。</li><li>只打勾也可以；耗时与感受始终可选。</li><li>在「随手记」记录待办与感受，之后再安排或回看。</li><li>打开睡前阅读示例，体验回顾和调整下一周期。</li></ul><div class="form-info amber" style="margin-top:20px">这是本地原型，数据仅存在当前页面。刷新、关闭或重置都会清除修改；没有账户、AI 或联网存储。请勿在此保存需要长期保留的内容。</div>${button('close-modal','开始体验','btn primary full-width')}`);break;}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('article[role="button"]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{if(e.target.id==='record-search'){ui.query=e.target.value;$('#records-list').innerHTML=recordList()}if(e.target.form?.id==='plan-form')updatePeriodPreview()});
document.addEventListener('change',e=>{const f=e.target.form;if(f?.id==='note-form'&&e.target.name==='kind'){const reflection=e.target.value==='reflection';$('#note-todo-fields').hidden=reflection;$('#note-reflection-fields').hidden=!reflection;f.querySelector('label[for="f-content"]').textContent=reflection?'想留下的感受':'想做的事'}if(f?.id==='review-form'&&e.target.name==='decision'){const finish=e.target.value==='finish';$('#new-period').hidden=finish;$('#new-period').querySelectorAll('input,select').forEach(el=>el.disabled=finish);if(!finish){const p=planBy(f.dataset.id),same=e.target.value==='continue';['frequency','expectedMinutes'].forEach(n=>{f.elements[n].readOnly=same;if(same)f.elements[n].value=p[n]??''});f.elements.duration.disabled=same;if(same)f.elements.duration.value=p.duration;}}});
document.addEventListener('submit',e=>{const form=e.target;if(!['plan-form','note-form','task-form','quick-form','action-form','review-form'].includes(form.id))return;e.preventDefault();const data=Object.fromEntries(new FormData(form));const trim=v=>String(v||'').trim();
if(form.id==='plan-form'){if(!trim(data.title)||!trim(data.actionTitle)){formError(form,'请填写计划和行动的名称。');return}const p={id:uid('plan'),title:trim(data.title),reason:trim(data.reason),start:data.start,end:endDate(data.start,data.duration),duration:data.duration,frequency:Number(data.frequency),expectedMinutes:data.expectedMinutes===''?null:Number(data.expectedMinutes),actionTitle:trim(data.actionTitle),sample:false,closed:false,review:null};state.plans.push(p);generateTasks(p);ui.page='plans';ui.planId=p.id;closeModal();render();toast('新的尝试开始了。现在可以慢慢安排每一次行动。');}
if(form.id==='quick-form'){if(!trim(data.content)){toast('先写下一点内容吧。');return}saveNewRecord(ui.captureKind,trim(data.content));ui.query='';ui.recordTab=ui.captureKind==='reflection'?'reflections':'pending';render();toast('记下来了，之后再慢慢处理。');}
if(form.id==='note-form'){if(!trim(data.content)){formError(form,'请先写下一点内容。');return}if(data.source&&!safeUrl(data.source)){formError(form,'来源请使用 http 或 https 链接。');return}if(data.kind==='todo'&&data.time&&!data.date){formError(form,'填写具体时间时，请同时选择日期。');return}const n=noteBy(form.dataset.id);if(n){n.content=trim(data.content);n.source=trim(data.source);n.planId=data.planId||'';}else saveNewRecord(data.kind,trim(data.content),data);ui.captureKind=data.kind;ui.recordTab=data.kind==='reflection'?'reflections':'pending';if(ui.page==='notes')ui.query='';closeModal();render();toast(n?'已经保存这个念头。':'记下来了。');}
if(form.id==='task-form'){const t=taskBy(form.dataset.id),p=planBy(t.planId);if(!trim(data.title)){formError(form,'请填写行动或待办内容。');return}if(data.date&&p&&(data.date<p.start||data.date>p.end)){formError(form,'日期需要在考察期内。');return}if(data.time&&!data.date){formError(form,'填写具体时间时，请同时选择日期。');return}if(data.source&&!safeUrl(data.source)){formError(form,'来源请使用 http 或 https 链接。');return}const wasDone=t.done;t.title=trim(data.title);t.date=data.date;t.time=data.time;if(t.date)t.week=monday(t.date);t.done=data.done==='on';if(t.done&&!wasDone)t.doneAt=new Date().toISOString();if(!t.done)t.doneAt=null;t.minutes=data.minutes===''?null:Number(data.minutes);t.feeling=trim(data.feeling);if(!p)t.source=trim(data.source);closeModal();render();toast('已保存，相关页面也同步更新了。');}
if(form.id==='action-form'){if(!trim(data.title)){formError(form,'请填写行动名称。');return}const p=planBy(form.dataset.id),t=makeTask(p,data.week);t.title=trim(data.title);t.sample=false;state.tasks.push(t);closeModal();render();toast('已添加一条待安排行动。');}
if(form.id==='review-form'){const p=planBy(form.dataset.id),mode=e.submitter?.value||'save';if(mode==='save'||p.closed){p.review={text:trim(data.reviewText),decision:p.closed?p.review?.decision||'finish':'save',date:TODAY};closeModal();render();toast('回顾已保存，不急着决定。');return}const decision=data.decision;if(decision!=='finish'&&data.start<=p.end){formError(form,'下一周期请从本周期结束后开始，原周期会完整保留。');return}p.review={text:trim(data.reviewText),decision,date:TODAY};p.closed=true;if(decision!=='finish'){const duration=decision==='continue'?p.duration:data.duration;const np={id:uid('plan'),title:p.title,reason:p.reason,start:data.start,end:endDate(data.start,duration),duration,frequency:decision==='continue'?p.frequency:Number(data.frequency),expectedMinutes:decision==='continue'?p.expectedMinutes:data.expectedMinutes===''?null:Number(data.expectedMinutes),actionTitle:p.actionTitle,sample:false,closed:false,review:null,parentId:p.id};state.plans.push(np);generateTasks(np);p.nextId=np.id;}closeModal();render();toast(decision==='finish'?'这段尝试已经留下。结束也是一种选择。':'下一周期已创建，上一段经历完整保留。');}
});
function saveNewRecord(kind,content,data={}){if(kind==='reflection')state.notes.unshift({id:uid('note'),content,created:TODAY,source:data.source||'',planId:data.planId||'',sample:false});else state.tasks.unshift({id:uid('todo'),planId:null,title:content,date:data.date||'',time:data.time||'',week:data.date?monday(data.date):ui.week,done:false,doneAt:null,minutes:null,feeling:'',source:data.source||'',created:TODAY,sample:false});}
let dragging=null;document.addEventListener('dragstart',e=>{const el=e.target.closest('[data-drag]');if(!el)return;dragging=el.dataset.drag;e.dataTransfer.setData('text/plain',dragging);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const zone=e.target.closest('[data-drop-date],[data-drop-pending]');if(zone&&dragging){e.preventDefault();e.dataTransfer.dropEffect='move';zone.classList.add('dragover')}});
document.addEventListener('dragleave',e=>{const zone=e.target.closest('[data-drop-date],[data-drop-pending]');if(zone&&!zone.contains(e.relatedTarget))zone.classList.remove('dragover')});
document.addEventListener('drop',e=>{const zone=e.target.closest('[data-drop-date],[data-drop-pending]');if(!zone||!dragging)return;e.preventDefault();const id=e.dataTransfer.getData('text/plain');zone.classList.remove('dragover');if(id===dragging)changeTaskDate(id,zone.dataset.dropDate||'');dragging=null});
document.addEventListener('dragend',()=>{dragging=null;document.querySelectorAll('.dragover').forEach(el=>el.classList.remove('dragover'))});
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
seed();render();
</script>
</body>
</html>
